# Project policy for the HealthAndFitnessAndNutritionStandards repository itself.
#
# This is the first adopting project, and therefore the pattern every other project will copy —
# including its mistakes. Three rules govern what may appear here:
#
#   * Rule ids are canonical only (ADR 0001). The schema rejects any other spelling.
#   * `applicability` and `exceptions` are different mechanisms and never substitute for each other.
#       not-applicable = the behavior cannot occur within the evaluated scope.
#       exception      = the rule applies and this project knowingly does not satisfy it.
#     For a prohibition only the first is available, which is why each reason below states what this
#     repository cannot do rather than what would be inconvenient to do.
#   * Nothing here asserts compliance. What this project actually meets is an evaluation result.
#
# Shape: schemas/project-policy.schema.json. Meaning: standards/18-progressive-overload.md is not it —
# see docs/design/architecture.md and INSTRUCTIONS.md.
#
# WHAT THIS REPOSITORY IS, for the purposes of scope: a publisher of standards. It holds no personal
# health data, interprets nobody's measurements, and delivers no guidance to any reader about their
# own health, training, or diet. Its worked examples are labelled fictional illustrations of the
# standards, written to demonstrate the format rather than to advise anyone. That is the basis of
# every not-applicable declaration below, and the `revisitWhen` triggers are all the same event:
# this repository acquiring a capability that acts on a real person's data.
#
# What it DOES do is make claims about physiology and nutrition, in its standards prose and in the
# rationale of every catalog entry. So the rules about evidence quality and fabricated facts apply
# here in full, and are declared applicable below.

standardVersion: "1.0.0"
project: "HealthAndFitnessAndNutritionStandards"

# This repository is the pack, not an adopter of it (FE-13). Every other project running `check`
# must prove that the standards bytes producing its verdict are the immutable release it declared
# above; this one cannot, and the reason is structural rather than inconvenient. `main` is ahead of
# v1.0.0 by construction — that is what a development branch is — so its material will never match
# the released tree, and a pack that demanded proof of itself would have an unachievable gate, which
# is how requirements get quietly relaxed.
#
# What this does NOT do. It is honoured only when the directory being evaluated is the pack the
# evaluator was loaded from; declared anywhere else it stops the run with exit 3 under Standard 42.
# And it establishes nothing: a run in this mode reports `releaseIdentity.established: false` and
# says plainly that it is not an adoption. The line above remains what this repository claims; it is
# not evidence here either.
#
# The value is a sentence rather than `true` on purpose: a boolean flag is something a policy can
# acquire by copying, and this one has to be written deliberately by someone who means it.
packSelfMaintenance: "this-project-is-the-pack"

# Domains of guidance this project produces: none. The list is informational and switches nothing
# on or off — narrowing scope is done through applicability declarations, each carrying its own
# reason, so that a single line can never disable a category of prohibition silently.
domains: []

rules:
  # Rules that genuinely apply to a repository that publishes standards and makes claims about
  # health while doing so. Each is held at its catalog strength; nothing here lowers anything.
  integrity.no-standards-manipulation:
    note: "Binds the maintainers of this repository more directly than anyone else. The guards in scripts/ exist because of it."
  escalation.scope-disclosed:
    note: "The README states that this repository governs wellness guidance and is not medical advice."
  escalation.tier-model-documented:
    note: "docs/escalation-tiers.md is both this repository's own tier model and the exemplar adopters copy."
  escalation.tier-language-calibrated:
    note: "Standard 3 and the worked examples set the tone every adopter will imitate, so the wording here carries further than usual."
  trend.trends-over-events:
    note: "Standard 2 states the principle; the worked examples must not contradict it."
  trend.principle-documented:
    note: "Stated in Standard 2 and in the interpretation-record template."
  health.no-fabricated-medical-facts:
    note: "Applies in full. The rationale field of every health rule makes claims about physiology."
  nutrition.no-single-food-disease-claims:
    note: "Applies in full, for the same reason: this repository makes nutrition claims in its own prose."
  health.evidence-quality-noted:
    note: "The claims in standards prose and rule rationales should be traceable to something better than confident writing."

