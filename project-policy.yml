# No exceptions. Every rule that applies here is either met, failing, or honestly unevaluated, and a
# failing rule is reported as a failure rather than waived.
#
# Note what could not appear here even if someone wanted it: an exception naming any of the 34
# prohibitions or the integrity invariant. Writing one would not be recorded and would not be
# ignored — it stops evaluation with BLOCKED_BY_INVARIANT and exit code 3.
exceptions: []

# Recorded human judgement.
#
# Four rules apply here that no detector can establish. Each carries an attestation below because a
# person read the review material and decided, per rule, that the standard is met. `standards status`
# lists them under "Rules awaiting evidence" while they are unattested; a test asserts that list and
# the keys recorded here are the same set, so neither can drift from the other by hand.
#
# The invariant is not among them. It is NOT attestable and needs no attestation: since ADR 0007 it
# reports `screened` when every
# integrity check bound to it has run and none fired, which is a narrower claim than human
# attestation and is the only state it can reach. Attempting to attest it does not produce a green;
# it stops evaluation with BLOCKED_BY_INVARIANT and exit code 3. An earlier version of this comment
# named it here, and a certifier who followed that instruction would have read the system's refusal
# as their own error. See artifacts/adr/0007-screened-as-a-distinct-invariant-state.md.
#
# WHAT THESE ENTRIES ARE, AND WHAT THEY ARE NOT. Independent content review produced a disposition
# for each of the four — recorded in artifacts/release-review/dispositions.md, all four
# ESTABLISHABLE, two of them only after real defects were found and fixed at the content layer. A
# disposition is evidence offered to a decision-maker. It is not the decision. The `reviewedBy`
# below is the person who made the decision, and it is here because that person stated it.
#
# THAT DISTINCTION WAS LEARNED THE EXPENSIVE WAY. Four attestations were recorded at ad6bdcb and
# withdrawn at 7b650f2. Nothing about their content was wrong: the dispositions were the same ones
# cited below, the per-rule states matched the frozen prediction exactly, and every mechanical gate
# stayed green. The defect was provenance — the reviewedBy identity had been written on the
# authority of a draft supplied by the reviewing agent, which cannot confer human authority on
# anything, so the record asserted a judgement whose author could not be established. That is the
# "falsify evidence for" clause of integrity.no-standards-manipulation, and it holds regardless of
# whether the named person would have agreed, which in the end they did.
#
# The lesson to carry forward is not "do not do that again". It is that matching the predicted
# per-rule states is NOT sufficient evidence that a verdict-affecting input is what it claims to be.
# ad6bdcb reached exactly the predicted COMPLIANT state and was uncertifiable. Provenance is not a
# property any gate can read. Read artifacts/release-review/attestation-2026-08-11.md before
# recording, amending, or certifying anything in this block.
#
# Each entry's reviewedAgainst.paths fixes what was actually read. If any of those files changes,
# the digest stops matching and the rule returns to not-evaluated rather than silently carrying an
# approval of text nobody reviewed. `standards status` reports such an attestation as stale.
