# No exceptions. Every rule that applies here is either met, failing, or honestly unevaluated, and a
# failing rule is reported as a failure rather than waived.
#
# Note what could not appear here even if someone wanted it: an exception naming any of the 34
# prohibitions or the integrity invariant. Writing one would not be recorded and would not be
# ignored — it stops evaluation with BLOCKED_BY_INVARIANT and exit code 3.
exceptions: []

# Recorded human judgement.
#
# THIS SECTION IS DELIBERATELY EMPTY, and that is why `standards check` reports this repository as
# NOT_EVALUATED rather than COMPLIANT. Four rules apply here that only a human can establish:
# integrity.no-standards-manipulation, escalation.tier-language-calibrated, trend.trends-over-events,
# and health.no-fabricated-medical-facts.
#
# No attestation appears for them because no human has reviewed them yet. Writing one anyway — an
# agent recording a review that did not happen — would be the "falsify evidence for" clause of the
# very invariant being attested. The honest state of this repository is that it cannot yet
# demonstrate compliance, and the system says so.
#
# See INSTRUCTIONS.md for what an attestation looks like and what evidence it must carry.
attestations: {}
