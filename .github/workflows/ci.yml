# Continuous integration.
#
# THERE IS NO INSTALL STEP, AND THAT IS DELIBERATE. This repository has zero third-party
# dependencies; the absence of `npm ci` here is what makes that policy structural rather than
# aspirational. If an install step ever appears in this file, the dependency policy changed, and
# that change should be argued for in a commit message rather than discovered later.
#
# ORDER MATTERS. The guards run before the tests because each answers a question the tests assume:
# whether the standards series still has the shape a human reviewed, whether the catalog still
# contains the rules a human reviewed, and whether quoted source text is still the source's. A test
# suite passing against a catalog that quietly lost a prohibition is a green build that means
# nothing.
#
# `check` is the gate. `audit` runs without --strict on purpose: failing a build on warnings is how
# an audit step gets disabled, and the real error gate is the assertion inside the test suite that
# this repository produces no error-severity findings.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Standards series (has the series changed shape?)
        run: npm run inventory

      - name: Rule catalog (has a rule been dropped, downgraded, or reclassified?)
        run: npm run rules

      - name: Source fidelity (is quoted source text still the source's?)
        run: npm run fidelity

      - name: Project policy (is this repository's own policy well-formed?)
        run: npm run policy

      - name: Diagram freshness (does each embedded diagram match its Mermaid source?)
        run: npm run diagrams

      - name: Tests
        run: npm test

      - name: Audit this repository (evidence, not a verdict)
        run: npm run audit

      # The gate. Exit 4 is accepted, and the acceptance is written here rather than hidden in a
      # flag, because it is a statement about this repository's honest state rather than a relaxation
      # of the check.
      #
      # This repository's own status is NOT_EVALUATED. Four rules apply here that only a human can
      # establish — integrity.no-standards-manipulation, escalation.tier-language-calibrated,
      # trend.trends-over-events, and health.no-fabricated-medical-facts — and no human has recorded
      # a review of them. Adding an attestation to turn this green would be the "falsify evidence
      # for" clause of the very invariant being attested, so the honest result is reported instead.
      #
      # Exit 0, 1, 2, and 3 are all treated as they should be: 0 passes, and 1, 2, and 3 fail the
      # build. When the owner records those four reviews, delete the `|| [ $? -eq 4 ]` and this
      # comment, and the gate tightens to 0 alone.
      - name: Check this repository (the gate)
        run: npm run check || [ $? -eq 4 ]
