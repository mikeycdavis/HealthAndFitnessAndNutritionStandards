# Continuous integration, on GitHub's runners.
#
# THIS FILE NO LONGER DEFINES THE PIPELINE. It invokes ci/run-checks.sh, which is the one
# authoritative definition of what "CI passes" means for this repository and which is also what runs
# inside the local Docker pipeline (ci/ci.ps1, ci/ci.sh) and would run on a self-hosted runner. The
# reasoning about stage order, the absence of an install step, and the removal of the exit-4
# allowance all moved there, to the file that executes them.
#
# Two definitions of a pipeline agree until the day they matter. This one had already drifted once in
# a way no diff could catch — a comment here described the repository's verdict and the gate's
# behaviour, both of which had been true months earlier — and the fix was to stop maintaining a
# second copy of anything.
#
# WHY THIS CHECKOUT IS NOT SHALLOW. `actions/checkout@v4` fetches one commit and no tags by default,
# and until FE-13's verification slice that was merely a smaller checkout. It is now a difference in
# what this runner can prove: release identity is established by resolving refs/tags/v1.0.0 and
# comparing the pack material against the tree it designates, and a checkout with no tags cannot do
# that at all. The tests correctly fail closed in that environment — so without `fetch-depth: 0` the
# hosted runner would assert strictly less than the local container, which has the whole repository,
# and the two surfaces would disagree about what had been demonstrated.
#
# `fetch-depth: 0` is therefore not CI convenience. It is the evidence the evaluator needs in order
# to answer the question at all, and the shallow case it replaces is now asserted deliberately in
# test/release-gate.test.mjs rather than being whatever the environment happened to supply.
#
# A GitHub-hosted run is not required for a pull request in this repository: local Docker
# verification is the gate, and ci/submit-pr.* refuses to push a commit that has not passed it. This
# workflow is a second opinion, and it is deliberately kept able to run on its own.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags. FE-13: an identity check that depends on Git history must run
          # against a checkout that actually contains it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The whole pipeline, in the order ci/run-checks.sh defines: the guards before the tests,
      # `audit` for evidence, and `check` as the gate.
      - name: Run the pipeline (ci/run-checks.sh)
        run: bash ci/run-checks.sh
